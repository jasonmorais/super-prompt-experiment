# GraphQL code generation for LearnSphere.
#
# Mirrors the Cellix convention: each `*.graphql` schema file under the graphql
# package is merged with the base Cellix SDL, and typed resolver manifests plus
# a static SDL array are generated into `*.generated.ts` files that are consumed
# by the schema-builder / resolver-builder at runtime.
#
# Application SDL files are the source for generated resolver contracts.
schema:
  - "packages/cellix/graphql-core/src/schema/**/*.graphql"
  - "packages/cellix/graphql-core/src/schema/core/graphql-tools-scalars.ts"
  - "packages/learnsphere/graphql/src/schema/**/*.graphql"

generates:
  packages/learnsphere/ui-route-root/src/generated.tsx:
    documents:
      - 'packages/learnsphere/ui-route-root/src/**/*.container.graphql'
    config:
      withHooks: false
      withHOC: false
      withComponent: false
      useTypeImports: true
      enumsAsTypes: true
    plugins:
      - typescript
      - typescript-operations
      - typed-document-node

  packages/learnsphere/ui-staff-route-root/src/generated.tsx:
    documents:
      - 'packages/learnsphere/ui-staff-route-root/src/**/*.container.graphql'
    config:
      withHooks: false
      withHOC: false
      withComponent: false
      useTypeImports: true
      enumsAsTypes: true
    plugins:
      - typescript
      - typescript-operations
      - typed-document-node

  packages/learnsphere/ui-staff-route-team-management/src/generated.tsx:
    documents:
      - 'packages/learnsphere/ui-staff-route-team-management/src/**/*.container.graphql'
    config:
      withHooks: false
      withHOC: false
      withComponent: false
      useTypeImports: true
      enumsAsTypes: true
    plugins:
      - typescript
      - typescript-operations
      - typed-document-node

  packages/learnsphere/graphql/src/schema/builder/generated.ts:
    config:
      contextType: "../context.ts#GraphContext"
      useIndexSignature: true
      useTypeImports: true
      enumsAsTypes: true
      immutableTypes: true
      scalars:
        Date: Date
        DateTime: Date
        ObjectID: string
        JSON: any
        JSONObject: any
    plugins:
      - typescript
      - typescript-resolvers

  packages/learnsphere/graphql/src/schema/builder/schema-type-defs.generated.ts:
    plugins:
      - '@cellix/graphql-codegen/plugins/static-type-defs':
          sourceDir: 'packages/learnsphere/graphql/src/schema/types'
          exportName: 'learnsphereGraphqlTypeDefs'

  packages/learnsphere/graphql/src/schema/builder/resolver-manifest.generated.ts:
    plugins:
      - '@cellix/graphql-codegen/plugins/resolver-manifest':
          typesDir: 'packages/learnsphere/graphql/src/schema/types'
          resolversExportName: 'learnsphereGraphqlResolvers'
          permissionsExportName: 'learnsphereGraphqlPermissions'
