# GraphQL code generation for Simnova.
#
# Mirrors the Cellix convention: each `*.graphql` schema file under the graphql
# package is merged with the base Cellix SDL, and typed resolver manifests plus
# a static SDL array are generated into `*.generated.ts` files that are consumed
# by the schema-builder / resolver-builder at runtime.
#
# The blank scaffold ships with a single `health` query so the pipeline has
# something to generate; add application `.graphql` files to grow the schema.
schema:
  - "packages/cellix/graphql-core/src/schema/**/*.graphql"
  - "packages/simnova/graphql/src/schema/**/*.graphql"

generates:
  packages/simnova/graphql/src/schema/builder/generated.ts:
    plugins:
      - typescript
      - typescript-resolvers
