fragment LearnerDashboardContainerLearningRecordFields on LearningRecord {
	id
	courseId
	courseTitle
	courseCategory
	source
	assignedBy
	status
	progressPercent
	completedActivityCount
	assignedAt
	dueAt
	completedAt
	activityProgress {
		timeSpentMinutes
	}
}

query LearnerDashboardContainerMyLearning($organizationId: String!) {
	myLearning(organizationId: $organizationId) {
		...LearnerDashboardContainerLearningRecordFields
	}
}
