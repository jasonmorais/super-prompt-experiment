query LearnerDashboard($organizationId: String!) {
	myLearning(organizationId: $organizationId) {
		id
		courseId
		courseTitle
		courseCategory
		source
		assignedBy
		status
		progressPercent
		completedActivityCount
		assignedAt
		dueAt
		completedAt
		activityProgress {
			timeSpentMinutes
		}
	}
}
