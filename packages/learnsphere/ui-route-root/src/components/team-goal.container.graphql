fragment LearnerTeamGoalContainerTeamOperationFields on TeamOperation {
	id
	title
	description
	category
	priority
	status
	assigneeId
	assigneeDisplayName
	teamName
	createdBy
	assignedAt
	dueAt
	submittedAt
	completionNote
	completionEvidence
	confirmedAt
	confirmedBy
	isOverdue
	statusHistory { status changedAt changedBy note }
	thread {
		comments { id body authorId authorName createdAt }
		attachments { id fileName contentType size blobName uploadedBy uploadedAt }
	}
}

query LearnerTeamGoalContainerTeamGoal($organizationId: String!) {
	myTeamOperations(organizationId: $organizationId) { ...LearnerTeamGoalContainerTeamOperationFields }
}

mutation LearnerTeamGoalContainerComment($input: TeamOperationCommentInput!) {
	teamOperationComment(input: $input) { status { success errorMessage } teamOperation { ...LearnerTeamGoalContainerTeamOperationFields } }
}

mutation LearnerTeamGoalContainerAttach($input: TeamOperationAttachInput!) {
	teamOperationAttach(input: $input) { status { success errorMessage } teamOperation { ...LearnerTeamGoalContainerTeamOperationFields } }
}

mutation LearnerTeamGoalContainerRemoveAttachment($input: TeamOperationRemoveAttachmentInput!) {
	teamOperationRemoveAttachment(input: $input) { status { success errorMessage } teamOperation { ...LearnerTeamGoalContainerTeamOperationFields } }
}

mutation LearnerTeamGoalContainerSubmit($input: TeamOperationSubmitInput!) {
	teamOperationSubmit(input: $input) { status { success errorMessage } teamOperation { ...LearnerTeamGoalContainerTeamOperationFields } }
}
