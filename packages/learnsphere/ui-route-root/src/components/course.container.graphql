fragment LearnerCourseContainerCourseFields on Course {
	id
	title
	summary
	description
	category
	level
	skills
	discoverability
	requiresCompletionScreenshot
	lessonCount
	estimatedMinutes
	status
	modules {
		key
		title
		description
		order
		lessons {
			key
			title
			type
			content
			estimatedMinutes
			required
		}
	}
}

fragment LearnerCourseContainerLearningRecordFields on LearningRecord {
	id
	courseId
	status
	progressPercent
	completedActivityCount
	requiredActivityKeys
	requiresCompletionScreenshot
	completionScreenshot
	activityProgress {
		activityKey
		completedAt
		timeSpentMinutes
		assessmentScore
		attempts
	}
}

query LearnerCourseContainerCourseExperience($courseId: ObjectID!, $organizationId: String!) {
	courseById(id: $courseId) {
		...LearnerCourseContainerCourseFields
	}
	myLearning(organizationId: $organizationId) {
		...LearnerCourseContainerLearningRecordFields
	}
}

mutation LearnerCourseContainerCompleteActivity($input: RecordActivityInput!) {
	recordActivity(input: $input) {
		status {
			success
			errorMessage
		}
		learningRecord {
			...LearnerCourseContainerLearningRecordFields
		}
	}
}
