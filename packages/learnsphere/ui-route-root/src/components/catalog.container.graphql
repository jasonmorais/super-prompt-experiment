query LearnerCatalog($organizationId: String!) {
	courses(organizationId: $organizationId, status: PUBLISHED, limit: 30) {
		id
		title
		summary
		category
		level
		skills
		tags
		discoverability
		lessonCount
		estimatedMinutes
	}
	myLearning(organizationId: $organizationId) {
		id
		courseId
		status
		assignedBy
	}
}

mutation CatalogSelfEnroll($input: SelfEnrollInput!) {
	selfEnroll(input: $input) {
		status {
			success
			errorMessage
		}
		learningRecord {
			id
			courseId
			status
		}
	}
}
