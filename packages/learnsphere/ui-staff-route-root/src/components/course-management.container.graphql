query StaffCourseManagement($organizationId: String!) {
	teams(organizationId: $organizationId) { id name members { learnerId displayName email } }
	teamLearning(organizationId: $organizationId) { id learnerId learnerDisplayName learnerEmail teamName courseId source status assignmentId }
	courses(organizationId: $organizationId, limit: 100) {
		id
		title
		summary
		description
		category
		level
		status
		tags
		skills
		discoverability
		requiresCompletionScreenshot
		lessonCount
		estimatedMinutes
		updatedAt
		modules {
			key
			title
			description
			order
			lessons {
				key
				title
				type
				content
				estimatedMinutes
				required
			}
		}
	}
}

mutation StaffCreateCourse($input: CourseCreateInput!) {
	courseCreate(input: $input) {
		status {
			success
			errorMessage
		}
		course {
			id
			title
			status
		}
	}
}

mutation StaffAddCourseModule($input: CourseAddModuleInput!) {
	courseAddModule(input: $input) {
		status {
			success
			errorMessage
		}
		course {
			id
			lessonCount
			estimatedMinutes
		}
	}
}

mutation StaffSubmitCourse($id: ObjectID!) {
	courseSubmitForReview(id: $id) {
		status {
			success
			errorMessage
		}
		course {
			id
			status
		}
	}
}

mutation StaffPublishCourse($id: ObjectID!) {
	coursePublish(id: $id) {
		status {
			success
			errorMessage
		}
		course {
			id
			status
			publishedAt
		}
	}
}

mutation StaffUpdateCourse($input: CourseUpdateInput!) {
	courseUpdate(input: $input) {
		status { success errorMessage }
		course { id title status updatedAt }
	}
}

mutation StaffDeleteCourse($id: ObjectID!) {
	courseDelete(id: $id) {
		status { success errorMessage }
		course { id status }
	}
}

mutation StaffAssignCourseToLearner($input: AssignLearningInput!) {
	assignLearning(input: $input) { status { success errorMessage } learningRecord { id learnerId courseId status } }
}
