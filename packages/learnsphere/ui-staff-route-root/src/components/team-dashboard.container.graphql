query StaffTeamOverview($organizationId: String!, $teamName: String) {
	teams(organizationId: $organizationId) { id name members { learnerId displayName email } }
	teamLearning(organizationId: $organizationId, teamName: $teamName) {
		id
		learnerId
		learnerDisplayName
		learnerEmail
		teamName
		courseId
		courseTitle
		courseCategory
		source
		status
		assignedAt
		assignedBy
		dueAt
		completedAt
		progressPercent
		completedActivityCount
		isOverdue
		requiresCompletionScreenshot
		completionScreenshot
		activityProgress {
			timeSpentMinutes
			assessmentScore
		}
	}
	courses(organizationId: $organizationId, status: PUBLISHED, limit: 100) {
		id
		title
		category
		lessonCount
	}
}

mutation StaffAssignLearning($input: AssignLearningInput!) {
	assignLearning(input: $input) {
		status {
			success
			errorMessage
		}
		learningRecord {
			id
			learnerId
			courseId
			status
		}
	}
}

mutation StaffUnassignLearning($id: ObjectID!) { unassignLearning(id: $id) { status { success errorMessage } learningRecord { id } } }
