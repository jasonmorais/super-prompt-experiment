query StaffTeams($organizationId: String!) {
	teams(organizationId: $organizationId) {
		id
		schemaVersion
		createdAt
		updatedAt
		organizationId
		name
		createdBy
		teamLeadIds
		members { learnerId displayName email }
	}
	teamLearning(organizationId: $organizationId) {
		learnerId
		learnerDisplayName
		learnerEmail
		teamName
		assignmentId
	}
	courses(organizationId: $organizationId, status: PUBLISHED, limit: 100) { id title category }
}

mutation StaffCreateTeam($input: TeamCreateInput!) { teamCreate(input: $input) { status { success errorMessage } team { id name teamLeadIds members { learnerId displayName email } } } }
mutation StaffRenameTeam($input: TeamRenameInput!) { teamRename(input: $input) { status { success errorMessage } team { id name teamLeadIds members { learnerId displayName email } } } }
mutation StaffDeleteTeam($id: ObjectID!) { teamDelete(id: $id) { status { success errorMessage } team { id } } }
mutation StaffSetTeamMembers($input: TeamSetMembersInput!) { teamSetMembers(input: $input) { status { success errorMessage } team { id name teamLeadIds members { learnerId displayName email } } } }
mutation StaffSetTeamLeads($input: TeamSetLeadsInput!) { teamSetLeads(input: $input) { status { success errorMessage } team { id name teamLeadIds members { learnerId displayName email } } } }
mutation StaffAssignTeamCourse($input: TeamAssignCourseInput!) { teamAssignCourse(input: $input) { status { success errorMessage } assignmentId assignedCount } }
mutation StaffUnassignTeamCourse($input: TeamUnassignCourseInput!) { teamUnassignCourse(input: $input) { status { success errorMessage } assignmentId assignedCount } }
