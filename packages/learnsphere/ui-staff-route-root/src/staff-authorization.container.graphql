query CurrentStaffUserAndCreateIfNotExists {
	currentStaffUserAndCreateIfNotExists {
		displayName
		role {
			roleName
			enterpriseAppRole
			permissions {
				staffPortalPermissions {
					canViewTeamLearning
					canManageCourses
					canPublishCourses
					canDeleteCourses
					canManageTeams
					canManageTeamOperations
					canConfirmTeamOperations
					canManageAssessments
					canViewOrganization
					canManageOrganizationStructure
				}
			}
		}
	}
}
