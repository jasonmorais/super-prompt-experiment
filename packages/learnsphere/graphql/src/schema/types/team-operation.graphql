extend type Query {
	myTeamOperations(organizationId: String!): [TeamOperation!]!
	teamOperations(organizationId: String!, teamName: String): [TeamOperation!]!
}

extend type Mutation {
	teamOperationCreate(input: TeamOperationCreateInput!): TeamOperationMutationResult!
	teamOperationSubmit(input: TeamOperationSubmitInput!): TeamOperationMutationResult!
	teamOperationConfirm(input: TeamOperationConfirmInput!): TeamOperationMutationResult!
	teamOperationCancel(input: TeamOperationCancelInput!): TeamOperationMutationResult!
	teamOperationComment(input: TeamOperationCommentInput!): TeamOperationMutationResult!
	teamOperationAttach(input: TeamOperationAttachInput!): TeamOperationMutationResult!
}

enum TeamOperationPriority { LOW MEDIUM HIGH URGENT }
enum TeamOperationStatus { ASSIGNED IN_PROGRESS SUBMITTED COMPLETED CANCELLED }

type TeamOperationStatusEvent {
	status: TeamOperationStatus!
	changedAt: DateTime!
	changedBy: String!
	note: String
}

type TeamOperationComment {
	id: String!
	body: String!
	authorId: String!
	authorName: String!
	createdAt: DateTime!
}

type TeamOperationAttachment {
	id: String!
	fileName: String!
	contentType: String!
	size: Int!
	blobName: String!
	uploadedBy: String!
	uploadedAt: DateTime!
}

type TeamOperationThread {
	comments: [TeamOperationComment!]!
	attachments: [TeamOperationAttachment!]!
}

type TeamOperation implements MongoBase {
	id: ObjectID!
	schemaVersion: String!
	createdAt: DateTime!
	updatedAt: DateTime!
	organizationId: String!
	title: String!
	description: String!
	category: String!
	priority: TeamOperationPriority!
	status: TeamOperationStatus!
	assigneeId: String!
	assigneeDisplayName: String!
	assigneeEmail: String!
	teamName: String!
	createdBy: String!
	assignedAt: DateTime!
	dueAt: DateTime
	startedAt: DateTime
	submittedAt: DateTime
	submittedBy: String
	completionNote: String
	completionEvidence: String
	confirmedAt: DateTime
	confirmedBy: String
	statusHistory: [TeamOperationStatusEvent!]!
	thread: TeamOperationThread!
	isOverdue: Boolean!
}

input TeamOperationCreateInput {
	organizationId: String!
	title: String!
	description: String!
	category: String!
	priority: TeamOperationPriority!
	assigneeId: String!
	assigneeDisplayName: String!
	assigneeEmail: String!
	teamName: String!
	dueAt: DateTime
}
input TeamOperationSubmitInput { id: ObjectID! completionNote: String! completionEvidence: String }
input TeamOperationConfirmInput { id: ObjectID! note: String }
input TeamOperationCancelInput { id: ObjectID! reason: String! }
input TeamOperationCommentInput { id: ObjectID! body: String! }
input TeamOperationAttachInput { id: ObjectID! fileName: String! contentType: String! contentBase64: String! }
type TeamOperationMutationResult { status: MutationStatus! teamOperation: TeamOperation }
