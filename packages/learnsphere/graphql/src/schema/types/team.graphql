extend type Query {
	teams(organizationId: String!): [Team!]!
}

extend type Mutation {
	teamCreate(input: TeamCreateInput!): TeamMutationResult!
	teamRename(input: TeamRenameInput!): TeamMutationResult!
	teamDelete(id: ObjectID!): TeamMutationResult!
	teamSetMembers(input: TeamSetMembersInput!): TeamMutationResult!
	teamSetLeads(input: TeamSetLeadsInput!): TeamMutationResult!
	teamAssignCourse(input: TeamAssignCourseInput!): TeamAssignmentMutationResult!
	teamUnassignCourse(input: TeamUnassignCourseInput!): TeamAssignmentMutationResult!
}

type Team implements MongoBase {
	id: ObjectID!
	schemaVersion: String!
	createdAt: DateTime!
	updatedAt: DateTime!
	organizationId: String!
	name: String!
	members: [TeamMember!]!
	teamLeadIds: [String!]!
	createdBy: String!
}

type TeamMember { learnerId: String! displayName: String! email: String! }
input TeamMemberInput { learnerId: String! displayName: String! email: String! }
input TeamCreateInput { organizationId: String! name: String! }
input TeamRenameInput { id: ObjectID! name: String! }
input TeamSetMembersInput { id: ObjectID! members: [TeamMemberInput!]! }
input TeamSetLeadsInput { id: ObjectID! teamLeadIds: [String!]! }
input TeamAssignCourseInput { teamId: ObjectID! courseId: ObjectID! dueAt: DateTime }
input TeamUnassignCourseInput { organizationId: String! assignmentId: String! }
type TeamMutationResult { status: MutationStatus! team: Team }
type TeamAssignmentMutationResult { status: MutationStatus! assignmentId: String! assignedCount: Int! completedCount: Int! }
